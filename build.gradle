plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

tasks.named('wrapper', Wrapper).configure {
    gradleVersion = '8.11.1'
    distributionType = Wrapper.DistributionType.BIN
}

version = project.mod_version
group = project.mod_group_id

repositories {
    mavenLocal()
    mavenCentral()

    // ModMaven for JEI (Just Enough Items)
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }

    // Modrinth Maven for Jade, EMI, and other modpack libraries
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }

    // CurseForge Maven for pulling CurseForge mods by ID
    maven {
        name = "CurseMaven"
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }

    // Shedaniel Maven for Roughly Enough Items (REI) & Cloth Config
    maven {
        name = "Shedaniel"
        url = "https://maven.shedaniel.me/"
    }

    // TerraformersMC for EMI
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
}

base {
    archivesName = project.mod_id
}

// Target Java 21 for Minecraft 1.21.2+
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the NeoForge version
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Sets up a dependency configuration for local libraries not published to a repository
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // JEI (Just Enough Items) Integration
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:19.43.0.394"
    localRuntime "mezz.jei:jei-1.21.1-neoforge:19.43.0.394"

    // Jade (WAILA - What Are We Looking At) Integration
    compileOnly "maven.modrinth:jade:15.10.6+neoforge"
    localRuntime "maven.modrinth:jade:15.10.6+neoforge"
}

// Automatically substitute mod metadata into neoforge.mods.toml from gradle.properties
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : project.minecraft_version,
            minecraft_version_range: project.minecraft_version_range,
            neo_version            : project.neo_version,
            neo_version_range      : project.neo_version_range,
            loader_version_range   : project.loader_version_range,
            mod_id                 : project.mod_id,
            mod_name               : project.mod_name,
            mod_license            : project.mod_license,
            mod_version            : project.mod_version,
            mod_authors            : project.mod_authors,
            mod_description        : project.mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
