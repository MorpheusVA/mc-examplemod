# The name of the mod loader type to load - for regular Java Mods this should be javafml
modLoader="javafml" #mandatory

# A version range to match the common loader version
loaderVersion="${loader_version_range}" #mandatory

# The license for you mod. This is mandatory metadata and allows for easier comprehension of your redistributive rights.
license="${mod_license}"

# A URL to refer people to when problems occur with this mod
#issueTrackerURL="https://change.me.to.your.issue.tracker.org" #optional

# A list of mods - declared as a list of TOML tables
[[mods]] #mandatory

# The unique mod identifier for this mod
modId="${mod_id}" #mandatory

# The version number of the mod
version="${mod_version}" #mandatory

# A display name for the mod
displayName="${mod_name}" #mandatory

# A URL to query for updates for this mod. See the Update Checker grammar in the FML documentation
#updateJSONURL="https://change.me.example.com/updates.json" #optional

# A URL for the "homepage" for this mod, displayed in the mod UI
#displayURL="https://change.me.to.your.mods.homepage.example.com/" #optional

# A file name (not a path) of the logo file to display in the mod UI
#logoFile="examplemod.png" #optional

# A text field displayed in the mod UI to give credit to the mod team
#credits="" #optional

# A string giving the author or authors of the mod
authors="${mod_authors}" #optional

# The description text for the mod (multi line allowed)
description='''${mod_description}'''

# A dependency - declared the same as mods, but as a list of tables
[[dependencies.${mod_id}]] #optional
    # the modid of the dependency
    modId="neoforge" #mandatory
    # The type on the dependency
    type="required" #mandatory
    # The version range of the dependency
    versionRange="${neo_version_range}" #mandatory
    # An ordering relationship for the dependency - BEFORE or AFTER required if the relationship is not NONE
    ordering="NONE"
    # Side this dependency is applied on - BOTH, CLIENT, or SERVER
    side="BOTH"

# Here's another dependency
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
